  var STORE = "lockedPagesKey:" + SALT;
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function get() { try { return localStorage.getItem(STORE); } catch (e) { return null; } }
  function put(v) { try { v ? localStorage.setItem(STORE, v) : localStorage.removeItem(STORE); } catch (e) {} }
  async function unlock(raw) {
    var key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var zipped = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(DATA));
    var stream = new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Response(stream).text();
  }
  function show(html) {
    document.open(); document.write(html); document.close();
    window.dispatchEvent(new Event("resize"));
  }
  // 폰에서 키보드가 떠 있는 채로 페이지를 그리면 줄어든 높이가 남아 화면이 잘린다.
  // 입력칸 초점을 빼고 화면 높이가 더 바뀌지 않을 때까지(최대 1.5초) 기다린다.
  function keyboardDown() {
    if (document.activeElement) document.activeElement.blur();
    return new Promise(function (done) {
      var last = -1, still = 0, tries = 0;
      (function check() {
        var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        still = h === last ? still + 1 : 0; last = h;
        if (still >= 3 || ++tries > 30) done(); else setTimeout(check, 50);
      })();
    });
  }
  async function derive(pw) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);

  }
  var f = document.getElementById("f"), msg = document.getElementById("msg");
  f.onsubmit = async function (e) {
    e.preventDefault();
    msg.textContent = "여는 중…";
    try {
      var raw = await derive(document.getElementById("pw").value);
      var html = await unlock(raw);
      if (document.getElementById("keep").checked) put(btoa(String.fromCharCode.apply(null, raw)));
      await keyboardDown();
      show(html);

  if (saved) unlock(b64(saved)).then(show, function () { put(null); f.hidden = false; });
